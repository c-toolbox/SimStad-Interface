image: node:21-alpine3.18

stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy

build-job:
  stage: build

  script:
    #- apt-get update -qy && apt-get upgrade -qy    # This line used for updating OS repositories
    #- apt-get install -y git
    - echo "Compiling the code..."
    #- echo $PATH
    #- pwd
    #- ls 
    #- cd ..
    #- ls 
    #- git clone git@gitlab.liu.se:simstad/exhibition.git
    #- cd exhibition/Scripts
    #- python convert_localization_excel.py
    #- ls
    - npm install 
    - npm run build
    - echo "Compile complete."

  artifacts:
    paths:
      - dist/win/digitaltwincity-interface


  cache:
    key: build-cache
    paths:
    - dist/win/digitaltwincity-interface


deploy-manually:

  stage: deploy
  when: manual
  tags:
    - windows
    - unreal
  script: 
    - ls
    - Compress-Archive -Path dist/win/digitaltwincity-interface  DigitalTwinInterface.zip

  artifacts:
    paths:
      - dist/win/digitaltwincity-interface
    expire_in: 10 days
  cache:
    key: build-cache
    paths:
      - dist/win/digitaltwincity-interface




