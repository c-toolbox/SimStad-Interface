image: node:24-alpine

stages:
  - build
  - release

build-job:
  stage: build

  before_script:
    - apk add --no-cache git

  script:
    - npm ci
    - npm run build
    - npx bestzip DigitalTwinCityInterface.zip dist/win/digitaltwincity-interface/*
  artifacts:
    name: "DigitalTwinCityInterface-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - DigitalTwinCityInterface.zip

release-job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-job
      artifacts: true
  script:
    - echo "Creating automated release for commit $CI_COMMIT_SHORT_SHA..."
  release:
    name: "Latest Build ($CI_COMMIT_SHORT_SHA)"
    tag_name: "v-$CI_COMMIT_SHORT_SHA"
    description: "Automated build generated from commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME."
    assets:
      links:
        - name: "DigitalTwinCityInterface.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/DigitalTwinCityInterface.zip?job=build-job"
